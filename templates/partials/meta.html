<!--
  标题区片段（meta）。{{占位符}} 全部替换为具体值：
  气质为安静编辑/人文书卷时眉题可省；杂志感用封面区（见 layout-patterns.md）。
-->
<p style="margin:0 0 14px;font-size:12px;letter-spacing:2px;color:{{ACCENT}};">{{眉题}}</p>
<h1 style="margin:0 0 12px;font-family:{{HEADING_FONT_STACK}};font-size:25px;font-weight:600;line-height:1.45;color:{{HEADING_COLOR}};letter-spacing:1px;">{{文章标题}}</h1>
<p style="margin:0 0 10px;font-size:15px;color:{{TEXT_SECONDARY}};line-height:1.7;">{{副标题（可选）}}</p>
<p style="margin:0 0 24px;font-size:13px;color:{{TEXT_SECONDARY}};letter-spacing:1px;">文 / {{作者}}　{{日期}}</p>
<div style="height:1px;background:{{DIVIDER}};margin:0 0 {{PARA_GAP}};"></div>
